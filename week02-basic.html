<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>두더지 잡기</title>

<style>
body {
    text-align: center;
    font-family: Arial;
}

canvas {
    border: 2px solid black;
}
</style>

</head>
<body>

<h1>두더지 잡기</h1>

<p>
점수 :
<span id="score">0</span> | 남은 시간 : <span id="time">30</span>초
</p>

<button onclick="startGame()">게임 시작</button>
<button onclick="resetGame()">게임 종료</button>

<canvas id="gameCanvas"
        width="600"
        height="400">
</canvas>
<script>
    const canvas = document.getElementById('gameCanvas'); // 캔버스 요소 가져오기
    const ctx = canvas.getContext('2d'); // 2D 컨텍스트 가져오기
    const scoreText = document.getElementById("score"); // 점수 표시 요소 가져오기
    const timeText = document.getElementById("time"); // 남은 시간 표시 요소 가져오기

    let moleX = 300; // 두더지 X축 설정
    let moleY = 200; // 두더지 Y축 설정
    let moleRadius = 30; // 두더지 원형 몸체 크기(반지름) 설정

    // 가시 관련 변수 설정
    let spikeX = 0;
    let spikeY = 0;
    let spikeRadius = 25; // 가시 판정 범위
    let isSpikeVisible = false; // 가시 출현 여부

    // [추가] 폭탄 관련 변수 설정
    let bombX = 0;
    let bombY = 0;
    let bombRadius = 25; // 폭탄 판정 범위
    let isBombVisible = false; // 폭탄 출현 여부

    let score = 0; // 게임 시작 점수

    let timeLeft = 30; // 게임 제한 시간
    let gameRunning = false; // 게임 진행 여부
    let moleSpeed = 1000; // 이동 속도
    let timerId; // 타이머 변수 초기화
    let moleMoveId; // 이동 타이머 변수 초기화

    function startGame() { // 게임 시작 함수
        score = 0; // 게임 시작 점수
        timeLeft = 30; // 게임 시작 제한 시간
        gameRunning = true; // 게임 진행 여부 확인

        scoreText.textContent = score; // 점수 표시 초기화
        timeText.textContent = timeLeft; // 남은 시간 표시 초기화

        clearInterval(timerId); // 클릭시 발생하는 제한 시간, 두더지 이동 인터벌이 쌓이지 않게 없애준다
        clearInterval(moleMoveId);

        moveObjects(); // 두더지, 가시, 폭탄 위치 변경
        
        timerId = setInterval(() => {
            timeLeft--; // 현재 남은 시간 감소
            timeText.textContent = timeLeft; // 현재 남은 시간 표시 업데이트
            if(timeLeft <= 0) {
                endGame(); // 시간 초과로 게임 종료
            }
        }, 1000);

        // 오브젝트 주기적 이동 인터벌 시작
        startMoleTimer();
    }

    // 두더지/가시/폭탄 이동 인터벌을 시작하는 전용 함수
    function startMoleTimer() {
        clearInterval(moleMoveId); // 기존 이동 타이머 초기화
        moleMoveId = setInterval(moveObjects, moleSpeed);
    }

    // 시간 초과 종료 함수
    function endGame() { 
        gameRunning = false; 
        clearInterval(timerId); 
        clearInterval(moleMoveId); 

        ctx.clearRect(0, 0, canvas.width, canvas.height); 
        ctx.font = '32px Arial'; 
        ctx.fillStyle = "black"; 
        ctx.textAlign = "center"; 
        ctx.fillText("시간 종료!", canvas.width / 2, 180); 
        ctx.fillText("최종 점수: " + score, canvas.width / 2, 230); 
    }

    // [추가] 폭탄 클릭 시 즉시 게임 종료 함수
    function endGameByBomb() {
        gameRunning = false;
        clearInterval(timerId);
        clearInterval(moleMoveId);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = '32px Arial';
        ctx.fillStyle = "red";
        ctx.textAlign = "center";
        ctx.fillText("💥 폭탄을 클릭했습니다!", canvas.width / 2, 160);
        ctx.fillStyle = "black";
        ctx.fillText("게임 오버", canvas.width / 2, 210);
        ctx.fillText("최종 점수: " + score, canvas.width / 2, 260);
    }

    function resetGame() {
        gameRunning = false; // 게임 진행 상태 끄기
        clearInterval(timerId); // 시간 타이머 멈춤
        clearInterval(moleMoveId); // 이동 타이머 멈춤

        // 변수 및 텍스트 초기화
        score = 0;
        timeLeft = 30;
        isSpikeVisible = false;
        isBombVisible = false;
        scoreText.textContent = score;
        timeText.textContent = timeLeft;

        // 캔버스 깨끗하게 비우기
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // 두더지 그리기
    function drawMole() {
        ctx.beginPath();
        ctx.arc(moleX, moleY, moleRadius, 0, Math.PI * 2);
        ctx.fillStyle = "brown"; 
        ctx.fill();
    }

    // 가시 그리기
    function drawSpike() {
        if (!isSpikeVisible) return;

        ctx.fillStyle = "gray";
        const spikeOffsets = [-15, 0, 15]; 

        spikeOffsets.forEach(offset => {
            ctx.beginPath();
            ctx.moveTo(spikeX + offset - 10, spikeY + 15);
            ctx.lineTo(spikeX + offset, spikeY - 20);
            ctx.lineTo(spikeX + offset + 10, spikeY + 15);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 1;
            ctx.stroke();
        });
    }

    // [추가] 폭탄 그리기
    function drawBomb() {
        if (!isBombVisible) return;

        // 폭탄 몸체 (검은색 원)
        ctx.beginPath();
        ctx.arc(bombX, bombY, bombRadius, 0, Math.PI * 2);
        ctx.fillStyle = "black";
        ctx.fill();

        // 폭탄 심지 (빨간색 선)
        ctx.beginPath();
        ctx.moveTo(bombX, bombY - bombRadius);
        ctx.lineTo(bombX + 10, bombY - bombRadius - 10);
        ctx.strokeStyle = "red";
        ctx.lineWidth = 3;
        ctx.stroke();
    }
    
    // 오브젝트들 위치 재설정 함수
    function moveObjects() {
        ctx.clearRect(0, 0, canvas.width, canvas.height); // 캔버스 전체 비우기

        // 1. 두더지 위치 설정
        moleX = Math.random() * (canvas.width - 80) + 40;
        moleY = Math.random() * (canvas.height - 80) + 40;
        drawMole();

        // 2. 가시 위치 설정 (40% 확률)
        if (Math.random() < 0.4) {
            isSpikeVisible = true;
            let distance;
            do {
                spikeX = Math.random() * (canvas.width - 80) + 40;
                spikeY = Math.random() * (canvas.height - 80) + 40;
                const dx = spikeX - moleX;
                const dy = spikeY - moleY;
                distance = Math.sqrt(dx * dx + dy * dy);
            } while (distance < (moleRadius + spikeRadius + 20));

            drawSpike();
        } else {
            isSpikeVisible = false;
        }

        // 3. [추가] 폭탄 위치 설정 (30% 확률)
        if (Math.random() < 0.3) {
            isBombVisible = true;
            let distMole, distSpike;
            do {
                bombX = Math.random() * (canvas.width - 80) + 40;
                bombY = Math.random() * (canvas.height - 80) + 40;

                // 두더지와 거리 계산
                const dxMole = bombX - moleX;
                const dyMole = bombY - moleY;
                distMole = Math.sqrt(dxMole * dxMole + dyMole * dyMole);

                // 가시와 거리 계산
                const dxSpike = bombX - spikeX;
                const dySpike = bombY - spikeY;
                distSpike = Math.sqrt(dxSpike * dxSpike + dySpike * dySpike);

            } while (distMole < (moleRadius + bombRadius + 20) || 
                    (isSpikeVisible && distSpike < (spikeRadius + bombRadius + 20)));

            drawBomb();
        } else {
            isBombVisible = false;
        }
    }

    canvas.addEventListener("click", function (event) { // 클릭 이벤트 함수
        if (!gameRunning) return;

        const rect = canvas.getBoundingClientRect();
        const mouseX = event.clientX - rect.left; 
        const mouseY = event.clientY - rect.top; 

        // 1. 두더지 클릭 판정
        const dxMole = mouseX - moleX;
        const dyMole = mouseY - moleY;
        const distMole = Math.sqrt(dxMole * dxMole + dyMole * dyMole);
        
        if (distMole <= moleRadius) {
            score++; // 점수 1점 증가
            scoreText.textContent = score;
            
            moveObjects(); // 위치 즉시 재설정
            startMoleTimer(); // 이동 타이머 리셋
            return;
        }

        // 2. 가시 클릭 판정
        if (isSpikeVisible) {
            const dxSpike = mouseX - spikeX;
            const dySpike = mouseY - spikeY;
            const distSpike = Math.sqrt(dxSpike * dxSpike + dySpike * dySpike);

            if (distSpike <= spikeRadius) {
                score--; // 점수 1점 감점
                scoreText.textContent = score;
                
                isSpikeVisible = false;
                moveObjects(); // 위치 즉시 재설정
                startMoleTimer(); // 이동 타이머 리셋
                return;
            }
        }

        // 3. [추가] 폭탄 클릭 판정 (즉시 게임 종료)
        if (isBombVisible) {
            const dxBomb = mouseX - bombX;
            const dyBomb = mouseY - bombY;
            const distBomb = Math.sqrt(dxBomb * dxBomb + dyBomb * dyBomb);

            if (distBomb <= bombRadius) {
                endGameByBomb(); // 폭탄 게임 오버 실행
            }
        }
    });
</script>

</body>
</html>
