<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Flappy Bird</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        canvas {
            border: 2px solid black;
            background: skyblue;
        }
    </style>
</head>

<body>
    <h1>Flappy Bird</h1>
    <p>점수: <span id="score">0</span> | 최고 기록 : <span id="highScore">0</span></p>
    <p>조작: Space 키 또는 마우스 클릭 <button id="restartBtn" onclick="restart(); this.blur();">다시 시작</button></p>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    <script>
        // 추가 순서 1번 // 추가 순서 8번 ((상단) 리스타트 버튼 추가, this.blur는 재시작 버튼이 계속 실행되는 걸 방지) // 추가 순서 16번 최고 기록 저장 기능
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("score");
        let score = 0;
        let gameOver = false;

        // 추가 순서 2번
        const bird = {
            x : 80, y : 250, radius : 15,
            velocity : 0, // 현재의 속도, 매 프레임마다 변함 (양수 : 낙하, 음수 : 상승)
            gravity : 0.3, // 현재의 중력 가속도, 매 프레임마다 변하지 않음 (속도와 중력이 만나 점점 빨라지는 것처럼 보임 -> 새의 낙하로 이어짐)
            jumpPower : -6.5 // 점프 시 튀어오르는 정도
        };

        // 보호막 활성화 여부 변수
        let hasShield = false;

        // 추가 순서 3번
        function drawBird() {
            ctx.beginPath(); // 새의 노란 몸통 그리기
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fillStyle = "yellow";
            ctx.fill();

            ctx.fillStyle = "black"; // 새의 검은 눈 그리기 (몸통 중심 좌표(0,0) 에서 오른쪽 위(5,5)에 위치)
            ctx.beginPath();
            ctx.arc(bird.x+5, bird.y-5, 3, 0, Math.PI * 2);
            ctx.fill();

            // 보호막이 활성화된 경우 새 둘레에 푸른색 반투명 보호막 테두리 그리기
            if (hasShield) {
                ctx.beginPath();
                ctx.arc(bird.x, bird.y, bird.radius + 6, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(0, 191, 255, 0.8)";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = "rgba(0, 191, 255, 0.2)";
                ctx.fill();
            }
        }
        // drawBird();

        // 추가 순서 4번
        function moveBird() {
            bird.velocity += bird.gravity; // 속도에 따라 매 프레임마다 중력 가속도가 누적되며 점점 가속됨
            bird.y += bird.velocity; // y좌표도 속도에 따라 달라짐

            if(bird.y - bird.radius < 0 || bird.y + bird.radius > canvas.height) {
                // 천장이나 바닥 충돌 시 보호막이 있으면 소비하며 튕겨내고, 없으면 게임 오버
                if (hasShield) {
                    hasShield = false;
                    bird.velocity = bird.jumpPower * 0.8; // 충돌 시 약간의반동으로 튀어오름
                    if (bird.y - bird.radius < 0) bird.y = bird.radius;
                    if (bird.y + bird.radius > canvas.height) bird.y = canvas.height - bird.radius;
                } else {
                    endGame(); // 새의 위쪽이나 아래쪽이 위 아래 경계를 넘어가면 게임 종료
                }
            }
        }

        // 추가 순서 6번
        function jump() {
            if(gameOver) return;
            bird.velocity = bird.jumpPower;
        }

        // 추가 순서 7번
        document.addEventListener("keydown", function (event) {
            if(event.code === "Space"){
                jump();
            }
        });

        canvas.addEventListener("click", jump);

        // 추가 순서 9번
        function restart() { // 리스타트 함수 -> 추가 순서 8번과 연결
            if(!gameOver) return;

            bird.y = 250;
            bird.velocity = 0;

            pipes.length = 0;
            
            // 재시작 시 아이템 및 효과 초기화
            items.length = 0;
            isSlowMotion = false;
            isFastMotion = false; // [추가 기능] 패스트 타임 초기화
            slowTimer = 0;
            fastTimer = 0; // [추가 기능] 패스트 타임 타이머 초기화
            pipeSpeed = normalSpeed;
            hasShield = false;

            score = 0;
            scoreText.textContent = 0;

            startCountdown(); // 재시작 버튼 누르면 카운트다운 시작

            gameOver = false;
            gameLoop();
        }

        let countdown = 3; // 추가 순서 10번, 카운트다운과 타이머 추가

        function startCountdown() {
            countdown = 3;
            const timer = setInterval(function () {
                countdown--;
                if(countdown <= 0) clearInterval(timer);
            }, 1000);
        }

        const pipes = []; // 추가 순서 11번
        const pipeWidth = 60; // 파이프 가로 너비(좌우 길이)
        const pipeGap = 140; // 위 파이프와 아래 파이프 간의 빈 공간 간격
        let normalSpeed = 3; // 기본 파이프 속도
        let pipeSpeed = normalSpeed; // 매 프레임마다 파이프 이동 속도

        // 아이템 관리 배열 및 속도 타이머 변수
        const items = []; 
        let isSlowMotion = false; // 슬로우모션 상태 여부
        let slowTimer = 0; 
        let isFastMotion = false; // [추가 기능] 패스트 타임 상태 여부
        let fastTimer = 0; // [추가 기능] 패스트 타임 타이머

        function createPipe() {
            if (countdown > 0) return;
            const topHeight = Math.random() * 220 + 50; // 파이프를 랜덤 위치에 생성
            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap, // 아래 파이프는 위 파이프 시작 좌표값(canvas.width,0)에 pipeGap을 더해서 생성
                passed: false // 파이프 통과 여부 체크
            });

            // 1. 일반 아이템 생성 (파이프 사이 틈새 중앙 - 확률 50%)
            if (Math.random() < 0.5) {
                const rand = Math.random();
                let itemType = "coin";
                if (rand < 0.3) itemType = "slow";
                else if (rand < 0.6) itemType = "fast"; // [추가 기능] ⚡ 패스트 타임 아이템 생성
                else if (rand < 0.8) itemType = "shield";

                items.push({
                    x: canvas.width + pipeWidth / 2, // 파이프 중앙 X 위치
                    y: topHeight + pipeGap / 2,     // 파이프 틈새 중앙 Y 위치
                    radius: 14,
                    type: itemType,
                    collected: false
                });
            }

            // 2. 운석 아이템 생성 (확률 25%, 파이프 영역을 피한 공중에 스폰)
            if (Math.random() < 0.25) {
                const randomY = Math.random() * (canvas.height - 100) + 50;
                items.push({
                    x: canvas.width + pipeWidth + 100, 
                    y: randomY,
                    radius: 16,
                    type: "meteor",
                    collected: false
                });
            }
        }

        // 추가 순서 12번
        function drawPipes() {
            ctx.fillStyle = "green";

            for (let pipe of pipes) {
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight); // 위 파이프(사각형) 그리기, 사각형은 시작 x,y 좌표, 너비, 높이 정보가 필요함
                ctx.fillRect(pipe.x, pipe.bottomY, pipeWidth, canvas.height - pipe.bottomY); // 아래 파이프 그리기
            }
        }

        // 화면에 아이템 종류에 따라 이모지(⏱️, ⚡, 🪙, 🛡️, ☄️) 그리기
        function drawItems() {
            for (let item of items) {
                if (!item.collected) {
                    ctx.font = "20px Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    let emoji = "🪙";
                    if (item.type === "slow") emoji = "⏱️";
                    else if (item.type === "fast") emoji = "⚡"; // [추가 기능] 패스트 타임 이모지
                    else if (item.type === "shield") emoji = "🛡️";
                    else if (item.type === "meteor") emoji = "☄️"; 
                    
                    ctx.fillText(emoji, item.x, item.y);
                }
            }
        }

        // 추가 순서 13번
        function movePipes() {
            for(let pipe of pipes) { // "모든" 파이프를 왼쪽으로 이동시키는 반복문 -> 모든 파이프에 적용이라 배열 X
                pipe.x -= pipeSpeed;
                if(!pipe.passed && pipe.x + pipeWidth < bird.x){ // 새의 중심 좌표가 파이프의 오른쪽 벽을 지나면 통과로 판정
                    score++;
                    scoreText.textContent = score; // 통과하면 점수 획득
                    pipe.passed = true;

                    updateHighScore();
                }
            }
            for(let i=pipes.length-1; i>=0; i--){ // "경계 밖으로 나간" 파이프를 체크 후 삭제하는 반복문 -> 특정 파이프에 적용이라 배열 O
                if(pipes[i].x + pipeWidth < 0){
                    pipes.splice(i, 1);
                }
            }

            // 파이프 속도에 맞추어 아이템도 함께 왼쪽으로 이동
            for (let item of items) {
                item.x -= pipeSpeed;
            }
            // 화면 밖으로 벗어난 아이템 삭제
            for (let i = items.length - 1; i >= 0; i--) {
                if (items[i].x + items[i].radius < 0) {
                    items.splice(i, 1);
                }
            }
        }

        // 새와 아이템의 충돌 검사 및 효과 적용
        function checkItemCollision() {
            for (let item of items) {
                if (item.collected) continue;

                // 새의 중심과 아이템 중심 간의 거리 계산 (원형 충돌 판정)
                const dx = bird.x - item.x;
                const dy = bird.y - item.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                // 새와 아이템이 만나면
                if (distance < bird.radius + item.radius) {
                    item.collected = true;

                    if (item.type === "slow") {
                        // ⏱️ 슬로우모션 효과: 속도 1.5로 감소
                        isSlowMotion = true;
                        isFastMotion = false; // 패스트 타임 해제
                        slowTimer = 180; 
                        pipeSpeed = 1.5; 
                    } else if (item.type === "fast") {
                        // [추가 기능] ⚡ 패스트 타임 효과: 3초 동안 파이프 속도를 5.0으로 가속!
                        isFastMotion = true;
                        isSlowMotion = false; // 슬로우모션 해제
                        fastTimer = 180;
                        pipeSpeed = 5.0;
                    } else if (item.type === "coin") {
                        // 🪙 보너스 점수 아이템 효과
                        score += 3;
                        scoreText.textContent = score;
                        updateHighScore();
                    } else if (item.type === "shield") {
                        // 🛡️ 보호막 아이템 효과
                        hasShield = true;
                    } else if (item.type === "meteor") {
                        // ☄️ 운석 아이템 효과: 현재 화면의 모든 파이프 제거
                        pipes.length = 0;
                    }
                }
            }

            // 슬로우모션 타이머 차감 및 지속 시간 만료 처리
            if (isSlowMotion) {
                slowTimer--;
                if (slowTimer <= 0) {
                    isSlowMotion = false;
                    pipeSpeed = normalSpeed; // 원래 속도(3)로 복구
                }
            }

            // [추가 기능] 패스트 타임 타이머 차감 및 만료 처리
            if (isFastMotion) {
                fastTimer--;
                if (fastTimer <= 0) {
                    isFastMotion = false;
                    pipeSpeed = normalSpeed; // 원래 속도(3)로 복구
                }
            }
        }

        // 추가 순서 14번
        function checkCollision() {
            for(let i = 0; i < pipes.length; i++) {
                let pipe = pipes[i];
                const birdLeft = bird.x - bird.radius; // 새의 상하좌우 경계 설정
                const birdRight = bird.x + bird.radius;
                const birdTop = bird.y - bird.radius;
                const birdBottom = bird.y + bird.radius;

                const pipeLeft = pipe.x;
                const pipeRight = pipe.x + pipeWidth;

                const hitTopPipe = 
                    birdRight > pipeLeft && // 위 파이프와 새가 충돌하는 조건
                    birdLeft < pipeRight &&
                    birdTop < pipe.topHeight;

                const hitBottomPipe =
                    birdRight > pipeLeft && // 아래 파이프와 새가 충돌하는 조건
                    birdLeft < pipeRight &&
                    birdBottom > pipe.bottomY;

                if(hitTopPipe || hitBottomPipe) { // 파이프와 새가 충돌시
                    // 보호막이 있다면 한 번 방어 후 보호막 제거
                    if (hasShield) {
                        hasShield = false;
                        pipes.splice(i, 1);
                        break;
                    } else {
                        endGame(); // 보호막이 없으면 게임 종료
                    }
                }
            }
        }

        // 메달 및 세련된 카드 UI가 포함된 게임 오버 화면 함수
        function endGame() {
            gameOver = true;

            // [해결 방법] 게임 오버 순간 잔여 파이프를 모두 지워버려 결과창을 가리지 않게 합니다!
            pipes.length = 0; 

            // 1. 화면 전체를 어둡게 만드는 반투명 배경 오버레이
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 점수 결과가 표시될 카드 박스 배경 (흰색 반투명 박스)
            ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
            ctx.fillRect(canvas.width / 2 - 130, canvas.height / 2 - 100, 260, 180);

            // 3. 카드 테두리 그리기
            ctx.strokeStyle = "#d4af37";
            ctx.lineWidth = 4;
            ctx.strokeRect(canvas.width / 2 - 130, canvas.height / 2 - 100, 260, 180);

            // 4. "게임 오버" 타이틀 텍스트
            ctx.font = "bold 26px Arial";
            ctx.fillStyle = "#333333";
            ctx.textAlign = "center";
            ctx.fillText("게임 오버!", canvas.width / 2, canvas.height / 2 - 55);

            // 5. 점수 및 최고 기록 텍스트 표시
            ctx.font = "18px Arial";
            ctx.fillStyle = "#555555";
            ctx.fillText("점수 : " + score, canvas.width / 2, canvas.height / 2 - 15);
            ctx.fillText("최고 기록 : " + highScore, canvas.width / 2, canvas.height / 2 + 15);

            // 6. 점수에 따른 등급별 메달(이모지) 판정 및 출력
            let medal = "❌";
            if (score >= 20) {
                medal = "🥇 금메달";
            } else if (score >= 10) {
                medal = "🥈 은메달";
            } else if (score >= 5) {
                medal = "🥉 동메달";
            } else {
                medal = "🎖️ 노력상";
            }

            ctx.font = "bold 16px Arial";
            ctx.fillStyle = "#d9534f";
            ctx.fillText("획득 메달: " + medal, canvas.width / 2, canvas.height / 2 + 55);
        }

        const highScoreText = document.getElementById("highScore"); // 추가 순서 16번
        let highScore = Number(localStorage.getItem("flappyHighScore")) || 0; // 저장된 최고 기록을 가져옴
        highScoreText.textContent = highScore;

        function updateHighScore() {
            if(score > highScore) {
                highScore = score;
                highScoreText.textContent = highScore;
                localStorage.setItem("flappyHighScore", highScore);
            }
        }

        // 추가 순서 5번
        function gameLoop() {
            if(gameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if(countdown > 0){
                drawBird();
                ctx.font = "80px Arial";
                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.fillText(countdown, canvas.width/2, canvas.height/2);

                requestAnimationFrame(gameLoop);
                return;
            }
            moveBird();
            movePipes();
            checkItemCollision(); // 아이템 충돌 판정 및 효과 적용
            checkCollision();
            drawBird();
            drawPipes();
            drawItems(); // 아이템 화면 렌더링

            // 슬로우모션 발동 중일 때 상단에 안내 텍스트 표시
            if (isSlowMotion) {
                ctx.font = "bold 16px Arial";
                ctx.fillStyle = "blue";
                ctx.textAlign = "center";
                ctx.fillText("⏱️ 슬로우모션! (" + Math.ceil(slowTimer / 60) + "s)", canvas.width / 2, 30);
            }

            // [추가 기능] 패스트 타임 발동 중일 때 상단에 붉은색 경고 텍스트 표시
            if (isFastMotion) {
                ctx.font = "bold 16px Arial";
                ctx.fillStyle = "red";
                ctx.textAlign = "center";
                ctx.fillText("⚡ 패스트 타임! (" + Math.ceil(fastTimer / 60) + "s)", canvas.width / 2, 30);
            }

            requestAnimationFrame(gameLoop);
        }
        setInterval(createPipe, 1500);
        startCountdown();
        gameLoop();
    </script>
</body>

</html>
