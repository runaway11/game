<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공 잡기 게임</title>

<style>
body{
    text-align:center;
    font-family:Arial;
}

canvas{
    border:2px solid black;
}
</style>

</head>
<body>

<h1>공 잡기 게임</h1>

<p>
    점수 : <span id="score">0</span> |
    남은 시간 : <span id="time">30</span>초 |
    속도 : <span id="speed">1</span>단계
</p>
<button onclick="startGame()">게임 시작</button><br>
<canvas id="gameCanvas" width="600"
    height="400"> // 캔버스 좌우 크기 설정
</canvas>
<script>
    const canvas = document.getElementById("gameCanvas"); // 캔버스 요소 가져오기
    const ctx = canvas.getContext("2d"); // 캔버스 2d 컨텍스트 가져오기

    const scoreText = document.getElementById("score"); // 점수 보여주기
    const speedText = document.getElementById("speed"); // 속도 보여주기
    const timeText = document.getElementById("time"); // 시간 보여주기
    let score = 0; // 점수 0부터 시작
    let speedLevel = 1; // 속도 1단계부터 시작

    let timeLeft = 30; // 게임 시작시 변수 초기화 함수들
    let gameRunning = false;
    let timerId; // 타이머 id
    let animId; // 애니메이션 id

    // [추가 기능] 공의 종류(타입)를 관리하기 위한 객체 정의
    // 일반 공과 확률적으로 등장할 특별한 공(황금공 등)의 속성을 정의합니다.
    const ballTypes = [
        { color: "tomato", points: 1, timeBonus: 0, probability: 0.75 }, // 일반 공 (확률 75%)
        { color: "gold", points: 3, timeBonus: 2, probability: 0.20 },   // 보너스 공: 점수 3점, 시간 +2초 (확률 20%)
        { color: "deepskyblue", points: 5, timeBonus: 5, probability: 0.05 } // 슈퍼 공: 점수 5점, 시간 +5초 (확률 5%)
    ];

    function startGame() { // 게임 시작시 디폴트값 함수
        if(animId) {
            cancelAnimationFrame(animId); // 이미 실행중이던 게 있으면 애니메이션 id 를 취소하고 다시 시작
        }

        score = 0;
        timeLeft = 30;
        speedLevel = 1;

        ball.x = 300;
        ball.y = 200;
        ball.dx = 3;
        ball.dy = 2;

        // [추가 기능] 게임 시작 시 첫 공은 항상 일반 공(tomato)으로 초기화
        ball.color = "tomato";
        ball.points = 1;
        ball.timeBonus = 0;

        gameRunning = true;

        clearInterval(timerId); // 타이머 시작
        timerId = setInterval(() => {
            timeLeft--;
            timeText.textContent = timeLeft;
            if (timeLeft <= 0) endGame();
        }, 1000);
        drawGame();
    }

    function endGame(){
        gameRunning = false;
        clearInterval(timerId);
        
        if(animId) {
            cancelAnimationFrame(animId);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "32px Arial";
            ctx.fillStyle = "black";
            ctx.textAlign = "center";
            ctx.fillText("게임 종료!", canvas.width / 2, canvas.height / 2 - 30);
            ctx.fillText("최종 점수 : " + score, canvas.width / 2, canvas.height / 2 + 20); 
        }
    const ball = {
        x:300, y:200, radius:35, dx:3, dy:2, // 볼 객체의 속성들 (x좌표, y좌표, 반지름, dx, dy)
        color: "tomato", // [추가 기능] 현재 공의 색상 속성 추가
        points: 1,       // [추가 기능] 현재 공을 잡았을 때 얻는 점수 속성 추가
        timeBonus: 0     // [추가 기능] 현재 공을 잡았을 때 얻는 시간 보너스 속성 추가
    };

    function drawBall() { // 볼을 그리는 함수
        ctx.beginPath(); // 이전 것을 연결하지 않고 새로 그리겠다
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = ball.color; // [추가 기능] 고정된 "tomato" 대신 공 객체에 지정된 색상(`ball.color`)으로 채우기
        ctx.fill(); // 색깔 채우기 함수 호출
    }
    // drawBall();
    function updateBall() { // 볼 좌표값 실시간 관여 함수
        ball.x += ball.dx; // 볼의 x좌표가 dx 값만큼 실시간 증가
        ball.y += ball.dy; // 볼의 y좌표가 dy 값만큼 실시간 증가

        if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) { // 볼 테두리가 캔버스 경계에 닿으면 튕기기 
            ball.dx = -ball.dx;
        }
        if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) { 
            ball.dy = -ball.dy;
        }
    }
    function drawGame() { // 볼 잡기 게임 함수
        ctx.clearRect(0, 0, canvas.width, canvas.height); // 캔버스 비우기
        drawBall(); // 볼 그리기 함수 호출
        updateBall(); // 볼 실시간 이동 함수 호출
        animId = requestAnimationFrame(drawGame); // 이동하는 것처럼 보이는 반복문 애니메이션 추가
    }
    // drawGame();
    // setInterval(drawGame, 16); 끊김이 있는 움직임 추가

    canvas.addEventListener("click", function (event) { // 클릭 이벤트
        if (!gameRunning) return; // [개선 팁 반영] 게임 중이 아닐 때는 클릭 무시

        const rect = canvas.getBoundingClientRect();
        const mouseX = event.clientX - rect.left;
        const mouseY = event.clientY - rect.top;

        const dx = mouseX - ball.x;
        const dy = mouseY - ball.y;

        const distance = Math.sqrt(dx*dx+dy*dy);

        if (distance <= ball.radius) {
            if (gameRunning){ 
                score += ball.points; // [추가 기능] 고정으로 1점씩 올리는 대신, 현재 공의 가치(`ball.points`)만큼 점수 증가
                timeLeft += ball.timeBonus; // [추가 기능] 특별한 공을 잡았을 경우 남은 시간에 보너스 시간 추가
                timeText.textContent = timeLeft; // 화면의 남은 시간 텍스트 즉시 갱신
            }
            scoreText.textContent = score;
            speedLevel++;
            speedText.textContent = speedLevel;
            if (ball.dx > 0) {
                ball.dx += 0.5;
            } else {
                ball.dx -= 0.5;
            }
            if (ball.dy > 0) {
                ball.dy += 0.5;
            } else {
                ball.dy -= 0.5;
            }

            moveBallRandom();
        }
    });

    function moveBallRandom() {
        ball.x = Math.random() * (canvas.width - ball.radius*2) + ball.radius;
        ball.y = Math.random() * (canvas.height - ball.radius*2) + ball.radius;

        // [추가 기능] 공이 랜덤한 위치로 이동(재배치)될 때마다 확률에 따라 공의 종류를 새롭게 결정
        let randomVal = Math.random(); // 0 이상 1 미만의 난수 생성
        let cumulativeProbability = 0;

        for (let type of ballTypes) {
            cumulativeProbability += type.probability;
            if (randomVal <= cumulativeProbability) {
                ball.color = type.color;
                ball.points = type.points;
                ball.timeBonus = type.timeBonus;
                break;
            }
        }
    }
</script>

</body>

</html>
