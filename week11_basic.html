<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Mini Mario</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        canvas {
            border: 2px solid black;
            background: skyblue;
        }
    </style>
</head>

<body>
    <h1>Mini Mario</h1>
    <p>점수: <span id="score">0</span> | 생명: <span id="life">3</span></p>
    <p>조작: ← / → 이동, Space 점프, R 재시작</p>
    <canvas id="gameCanvas" width="700" height="400"></canvas>
<script>
    /* 추가 순서 1번 */
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreText = document.getElementById("score");
    let score = 0;
    let gameOver = false;
    let gameClear = false;
    const gravity = 0.6;

    const platforms = [
        {x: 0, y: 360, width: 700, height: 40}, // 첫번째 바닥 플랫폼
        {x: 140, y: 290, width: 120, height: 20}, // 첫번째 공중 플랫폼
        {x: 320, y: 230, width: 120, height: 20}, // 두번째 공중 플랫폼
        {x: 500, y: 170, width: 120, height: 20} // 세번째 공중 플랫폼
    ];

    /* 추가 순서 2번 */
    function drawPlatforms() {
        ctx.fillStyle = "sienna";
        for (let platform of platforms){ // 반복문으로 플랫폼 그리기
            ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
        }
    }
    drawPlatforms();

    /* 추가 순서 3번 */
    const coins = [
        {x: 180, y: 250, radius: 10, collected: false}, // 첫번째 플랫폼 위 코인, collected : 코인 획득 여부
        {x: 360, y: 190, radius: 10, collected: false}, // 두번째 플랫폼 위 코인
        {x: 540, y: 130, radius: 10, collected: false} // 세번째 플랫폼 위 코인
    ];

    function drawCoins() {
        for (let coin of coins) {
            if(coin.collected) continue;
            ctx.beginPath();
            ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
            ctx.fillStyle = "gold";
            ctx.fill();
        }
    }
    drawCoins();

    /* 추가 순서 4번 */
    const goal = { x: 650, y: 300, width: 30, height: 60 };

    function drawGoal() {
        ctx.fillStyle = "green";
        ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
        ctx.fillStyle = "white";
        ctx.fillRect(goal.x + 5, goal.y + 10, 20, 15);
    }
    drawGoal();

    /* 추가 순서 5번 */
    const player = {
        x: 50, y: 300, width: 35, height: 45,
        dx: 0, dy: 0, // 플레이어의 좌우,상하 좌표 이동 (speed 값만큼)
        speed: 5, jumpPower: -12,
        onGround: false
    };

    function drawPlayer() {
        ctx.fillStyle = "red";
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillStyle = "blue";
        ctx.fillRect(player.x, player.y+20, player.width, 25);
        ctx.fillStyle = "white";
        ctx.fillRect(player.x+8, player.y+10, 6, 6);
        ctx.fillRect(player.x+22, player.y+10, 6, 6);
    }
    drawPlayer();

    /* 추가 순서 6번 */
    const keys = {};

    document.addEventListener("keydown", function (event){
        keys[event.code] = true;
        if(event.code==="Space" && player.onGround){ // 스페이스바를 누르거나 = 플레이어가 지면에 있으면
            player.dy = player.jumpPower; // dy가 jumpPower만큼 증가
            player.onGround = false; // 플레이어는 공중에 뜬 상태
        }
    });
    document.addEventListener("keyup", function (event){
        keys[event.code] = false;
    });

    /* 추가 순서 7번 */
    function movePlayer() {
        player.dx = 0;
        if(keys["ArrowLeft"]){
            player.dx = -player.speed;
        }
        if(keys["ArrowRight"]){
            player.dx = player.speed;
        }
        player.x += player.dx;
        
        player.dy += gravity; // 플레이어의 상하 이동 속도와 y좌표는 중력 속도에 의해 변화
        player.y += player.dy;

        player.onGround = false;
        for(let platform of platforms) {
            if(player.x < platform.x + platform.width &&
                player.x + player.width > platform.x &&
                player.y < platform.y + platform.height &&
                player.y + player.height > platform.y
            ) {
                if(player.dy > 0) {
                    player.y = platform.y - player.height;
                    player.dy = 0;
                    player.onGround = true;
                }
            }
        }
        if (player.x < 0) { player.x = 0; } // 플레이어가 왼쪽 경계 밖으로 못 나가게
        if (player.x + player.width > canvas.width) { // 플레이어가 오른쪽 경계 밖으로 못 나가게
            player.x = canvas.width - player.width;
        }
    }

    /* 추가 순서 9번 */
    function checkCoinCollision() {
        for (let coin of coins) {
            if(coin.collected) continue;
            const playerCenterX = player.x + player.width / 2;
            const playerCenterY = player.y + player.height / 2;

            const dx = playerCenterX - coin.x; // 여기서의 dx, dy는 플레이어의 dx, dy와 다름 - 코인 간의 거리 변수 dx, dy를 의미함
            const dy = playerCenterY - coin.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if(distance < coin.radius + player.width / 2) {
                coin.collected = true;
                score++;
                scoreText.textContent = score;
            }
        }
    }

    /* 추가 순서 10번 */
    function checkGoalCollision() {
        if(player.x < goal.x + goal.width && 
            player.x + player.width > goal.x &&
            player.y < goal.y + goal.height &&
            player.y + player.height > goal.y
        ){
            clearGame();
        }
    }

    /* 추가 순서 11번 */
    function clearGame() {
        gameClear = true;
        drawMessage("게임 클리어!");
    }
    function endGame() {
        gameOver = true;
        drawMessage("게임 오버!");
    }

    /* 추가 순서 12번 */
    function drawMessage(message) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = "36px Arial";
        ctx.fillStyle = "white";
        ctx.textAlign = "center";

        ctx.fillText(message, canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillText("점수 : " + score, canvas.width / 2, canvas.height / 2 + 30);

        // [추가 기능] 종료 화면에 재시작 안내 문구 표시
        ctx.font = "20px Arial";
        ctx.fillText("R키를 눌러 재시작", canvas.width / 2, canvas.height / 2 + 75);
    }

    /* 추가 순서 13번 - 코드 최상단에 생명 부분도 같이 추가 */
    const lifeText = document.getElementById("life");
    let life = 3;

    /* 추가 순서 14번 */
    const enemies = [{
        x: 250, y: 330, width: 35, height: 30,
        dx: 2, minX: 180, maxX: 360, alive: true
    },
    {
        x: 350, y: 200, width: 35, height: 30,
        dx: 1.5, minX: 320, maxX: 440, alive: true
    }];

    function drawEnemies() {
        for(let enemy of enemies) {
            if(!enemy.alive) continue;
            ctx.fillStyle = "purple";
            ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            ctx.fillStyle = "white";
            ctx.fillRect(enemy.x + 7, enemy.y + 8, 6, 6);
            ctx.fillRect(enemy.x + 22, enemy.y + 8, 6, 6);
        }
    }

    /* 추가 순서 15번 */
    function moveEnemies() {
        for(let enemy of enemies) {
            if (!enemy.alive) continue;
            enemy.x += enemy.dx;
            if (enemy.x < enemy.minX || enemy.x + enemy.width > enemy.maxX){
                enemy.dx *= -1; // 좌우 경계의 끝에 닿으면 부호를 바꿔 반대로 이동하게 함
            }
        }
    }

    /* 추가 순서 16번 */
    function checkEnemyCollision() {
        for (let enemy of enemies) {
            if(!enemy.alive) continue;
            const isHit = player.x < enemy.x + enemy.width &&
            player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height &&
            player.y + player.height > enemy.y;

            if(isHit) {
                const playerBottom = player.y + player.height;
                const enemyTop = enemy.y;

                if(player.dy > 0 && playerBottom - enemyTop < 15) {
                    enemy.alive = false;
                    player.dy = -8;
                    score += 2;
                    scoreText.textContent = score;
                }else{
                    life--;
                    lifeText.textContent = life;
                    resetPlayer();
                    if(life <= 0) {
                        endGame();
                    }
                }
            }
        }
    }

    /* 추가 순서 17번 */
    function resetPlayer() {
        player.x = 50;
        player.y = 300;
        player.dx = 0;
        player.dy = 0;
    }

    /* [추가 기능 1] 가시 함정 위치 및 크기 데이터 배열 */
    const spikes = [
        { x: 430, y: 340, width: 60, height: 20 }, // 바닥 플랫폼 위(첫 번째 적과 깃발 사이) 가시 4개
        { x: 230, y: 275, width: 30, height: 15 }  // 첫 번째 공중 플랫폼 오른쪽 끝 가시 2개
    ];

    /* [추가 기능 2] 가시 함정 그리기 함수 (가로 15px 단위로 뾰족한 삼각형을 반복해서 그림) */
    function drawSpikes() {
        ctx.fillStyle = "dimgray";
        for (let spike of spikes) {
            const spikeWidth = 15; // 가시 1개당 밑변 너비
            const count = Math.floor(spike.width / spikeWidth); // 전체 너비에 들어갈 가시 개수 계산

            for (let i = 0; i < count; i++) {
                const startX = spike.x + i * spikeWidth;
                ctx.beginPath();
                ctx.moveTo(startX, spike.y + spike.height);                 // 왼쪽 아래 꼭짓점
                ctx.lineTo(startX + spikeWidth / 2, spike.y);               // 위쪽 뾰족한 꼭짓점
                ctx.lineTo(startX + spikeWidth, spike.y + spike.height);    // 오른쪽 아래 꼭짓점
                ctx.closePath();
                ctx.fill();
            }
        }
    }

    /* [추가 기능 3] 가시 함정 충돌 판정 함수 (적과 달리 위에서 밟아도 처치되지 않고 무조건 생명 감소) */
    function checkSpikeCollision() {
        for (let spike of spikes) {
            const isHit = player.x < spike.x + spike.width &&
                          player.x + player.width > spike.x &&
                          player.y < spike.y + spike.height &&
                          player.y + player.height > spike.y;

            if (isHit) {
                life--;
                lifeText.textContent = life;
                resetPlayer();
                if (life <= 0) {
                    endGame();
                }
            }
        }
    }

    /* [추가 기능 4] 재시작 시 적을 원래 위치와 방향으로 되돌리기 위해 초기값 백업 */
    for (let enemy of enemies) {
        enemy.startX = enemy.x;
        enemy.startDx = enemy.dx;
    }

    /* [추가 기능 5] 점수, 생명, 코인, 적, 플레이어 상태를 모두 초기화하는 함수 */
    function restartGame() {
        const wasStopped = gameOver || gameClear; // 게임 오버/클리어 상태여서 루프가 멈춰 있었는지 확인

        score = 0;
        scoreText.textContent = score;

        life = 3;
        lifeText.textContent = life;

        gameOver = false;
        gameClear = false;

        for (let coin of coins) {
            coin.collected = false; // 모든 코인 미획득 상태로 복구
        }

        for (let enemy of enemies) {
            enemy.x = enemy.startX;   // 적 초기 X좌표 복구
            enemy.dx = enemy.startDx; // 적 초기 이동 방향 복구
            enemy.alive = true;       // 처치된 적 부활
        }

        resetPlayer();
        player.onGround = false;

        if (wasStopped) {
            gameLoop(); // 멈춰 있던 애니메이션 루프를 다시 시작
        }
    }

    /* [추가 기능 6] R키(한/영 상태 무관하게 물리 키 코드 KeyR 감지) 입력 시 게임 재시작 */
    document.addEventListener("keydown", function (event) {
        if (event.code === "KeyR") {
            restartGame();
        }
    });

    /* 추가 순서 8번 */
    function gameLoop() {
        if(gameOver || gameClear) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        movePlayer();
        moveEnemies();

        checkCoinCollision();
        checkGoalCollision();
        checkEnemyCollision();
        checkSpikeCollision(); // [추가 기능] 매 프레임 가시 함정과의 충돌 여부 검사

        drawCoins(); // 위에서 아래 순서로 차례대로 그려지며 위에 덮어지는 구조 = 순서 주의 
        drawGoal();
        drawPlatforms();
        drawSpikes(); // [추가 기능] 플랫폼 위에 가시 함정 그리기
        drawPlayer();
        drawEnemies();

        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>
</body>

</html>
